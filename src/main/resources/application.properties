spring.config.import=optional:file:env.properties

spring.application.name=additi-backend
spring.datasource.hikari.data-source-properties.sslmode=require

spring.datasource.url=jdbc:postgresql://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudflare R2 Configuration
cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.public-url=${R2_PUBLIC_URL}
cloudflare.r2.region=${R2_REGION}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Bakong KHQR Configuration
bakong.token=${BAKONG_TOKEN:}
bakong.merchant-id=${BAKONG_MERCHANT_ID:}
bakong.merchant-name=${BAKONG_MERCHANT_NAME:Additi Store}
bakong.account-id=${BAKONG_ACCOUNT_ID:}
bakong.currency=${BAKONG_CURRENCY:USD}
bakong.api-url=https://api-bakong.nbc.gov.kh

# Enable debug logging for Bakong service
logging.level.groupproject.additibackend.service.impl.BakongServiceImpl=DEBUG
logging.level.groupproject.additibackend.service.impl.PaymentServiceImpl=DEBUG




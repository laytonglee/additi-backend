spring.config.import=optional:file:env.properties

spring.application.name=additi-backend
spring.datasource.hikari.data-source-properties.sslmode=require

spring.datasource.url=jdbc:postgresql://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB

cloudflare.r2.account-id=your-access-key
cloudflare.r2.access-key-id=your-access-key
cloudflare.r2.secret-access-key=your-secret-key
cloudflare.r2.bucket-name=additi-products
cloudflare.r2.endpoint=https://abc123def456.r2.cloudflarestorage.com
cloudflare.r2.public-url=https://pub-xxxxx.r2.dev
cloudflare.r2.region=auto

# Bakong KHQR Configuration
bakong.token=${BAKONG_TOKEN:}
bakong.merchant-id=${BAKONG_MERCHANT_ID:}
bakong.merchant-name=${BAKONG_MERCHANT_NAME:Additi Store}
bakong.account-id=${BAKONG_ACCOUNT_ID:}
bakong.currency=${BAKONG_CURRENCY:USD}
bakong.api-url=https://api-bakong.nbc.gov.kh


